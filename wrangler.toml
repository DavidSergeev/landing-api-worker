name = "landing-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGINS = "https://david-slutsky.com,https://davidsergeev.github.io,http://localhost:5173"

[[routes]]
pattern = "api.david-slutsky.com"
custom_domain = true

# Stores 24h "already scheduled a meeting" cooldown markers, keyed by a hash of
# (IP, User-Agent). See buildScheduleMeetingBlockKey() in src/index.js.
[[kv_namespaces]]
binding = "SCHEDULE_MEETING_BLOCKS"
id = "2dd48638f0f14f4cbb5d1759f62862da"
