name = "landing-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGINS = "https://david-slutsky.com,https://davidsergeev.github.io,http://localhost:5173"

[[routes]]
pattern = "api.david-slutsky.com"
custom_domain = true

# Stores 24h "already scheduled a meeting" cooldown markers, keyed by a hash of
# (IP, User-Agent). See buildScheduleMeetingBlockKey() in src/index.js.
[[kv_namespaces]]
binding = "SCHEDULE_MEETING_BLOCKS"
id = "2dd48638f0f14f4cbb5d1759f62862da"

# Stores 2h chat warm-up throttle markers, keyed by a hash of (IP, User-Agent).
# See buildWakeUpBlockKey() in src/index.js. Create with:
#   npx wrangler kv namespace create WAKE_UP_BLOCKS
# then replace the placeholder id below with the one it prints.
[[kv_namespaces]]
binding = "WAKE_UP_BLOCKS"
id = "ef478340bacc4c8d9d5db35d3cb5908a"
